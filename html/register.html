    <!-- =================================================

    <a href="index.html"

            🎓

         ================================================= -->

    <div class="auth-buttons">


        <a href="login.html">

            Register

        </a>


    </div>


</header>



<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<main class="main-content">


    <!-- =================================================
         REGISTER SECTION
         ================================================= -->

    <section class="register-section"
             aria-labelledby="register-title">


        <div class="register-header">

            <p class="section-label">
                Student Account
            </p>

            <h1 id="register-title">
                Create Your Account
            </h1>

            <p class="register-description">
                Register for StudentHub and access
                your student portal.
            </p>

        </div>



        <!-- =================================================
             REGISTER FORM
             ================================================= -->

        <form class="register-form"
              action="#"
              method="post">


            <!-- =================================================
                 FULL NAME
                 ================================================= -->

            <div class="form-group">

                <label for="full-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full-name"
                    name="full-name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>



            <!-- =================================================
                 EMAIL
                 ================================================= -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required>

            </div>



            <!-- =================================================
                 USERNAME
                 ================================================= -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required>

            </div>



            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required>

            </div>



            <!-- =================================================
                 CONFIRM PASSWORD
                 ================================================= -->

            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required>

            </div>



            <!-- =================================================
                 TERMS
                 ================================================= -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required>


                <label for="terms">

                    I agree to the

                    <a href="#">
                        Terms & Conditions
                    </a>

                </label>

            </div>



            <!-- =================================================
                 REGISTER BUTTON
                 ================================================= -->

            <button
                type="submit"
                class="register-submit">

                Create Account

            </button>


        </form>



        <!-- =================================================
             LOGIN LINK
             ================================================= -->

        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </section>


</main>
