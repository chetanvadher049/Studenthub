<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Login</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/shared.css">
</head>

<body>

<header class="site-header">

    <div class="menu-container">

        <details class="menu-details">

            <summary class="menu-button">
                <span></span>
                <span></span>
                <span></span>
            </summary>

            <nav class="dropdown-menu">

                <a href="index.html">🏠 Home</a>
                <a href="about.html">ⓘ About</a>
                <a href="dashboard.php">▣ Dashboard</a>
                <a href="events.html">▦ Events</a>
                <a href="profile.php">👤 Profile</a>
                <a href="contact.html">✉ Contact</a>
                <a href="admin.html">◉ Admin</a>
                <a href="faq.html">? FAQ</a>

            </nav>

        </details>

    </div>


    <a href="index.html" class="logo">

        <span class="logo-icon">🎓</span>

        <span class="logo-text">
            StudentHub
        </span>

    </a>


    <div class="auth-buttons">

        <button id="themeToggle" class="theme-button" type="button"
                aria-label="Switch to dark mode">🌙</button>

        <a href="login.html" class="active">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </div>

</header>


<main class="login-main">

    <section class="login-section">

        <div class="login-header">

            <p class="section-label">
                Student Account
            </p>

            <h1>
                Welcome Back!
            </h1>

            <p class="login-description">
                Sign in to access your StudentHub account.
            </p>

        </div>


        <form
            class="login-form"
            id="loginForm"
            action="../php/login.php"
            method="POST"
            novalidate
        >

            <input type="hidden" name="return_to" id="return_to" value="">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="login-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    maxlength="100"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        maxlength="100"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                    >
                        Show
                    </button>

                </div>

            </div>


            <p class="forgot-password">

                <a href="contact.html">
                    Forgot Password?
                </a>

            </p>


            <button
                type="submit"
                class="login-submit"
            >
                Login
            </button>

        </form>


        <p class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </section>

</main>


<footer class="site-footer">

    <p>
        &copy; 2026 StudentHub.
        All rights reserved.
    </p>

</footer>


<script src="../javascript/login.js?v=2" defer></script>

</body>
</html>
