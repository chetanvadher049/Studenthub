    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/shared.css?v=5">
</head>

<body>

<header class="site-header">

    <div class="menu-container">

        <details class="menu-details">

            <summary class="menu-button">
                <span></span>
                <span></span>
                <span></span>
            </summary>

            <nav class="dropdown-menu">

                <a href="index.html">🏠 Home</a>
                <a href="about.html">ⓘ About</a>
                <a href="dashboard.php">▣ Dashboard</a>
                <a href="events.html">▦ Events</a>
                <a href="profile.php">👤 Profile</a>
                <a href="contact.html">✉ Contact</a>
                <a href="admin.html">◉ Admin</a>
                <a href="faq.html">? FAQ</a>

            </nav>

        </details>

    </div>


    <a href="index.html" class="logo">

        <span class="logo-icon">🎓</span>

        <span class="logo-text">
            StudentHub
        </span>

    </a>


    <div class="auth-buttons">

        <button id="themeToggle" class="theme-button" type="button"
                aria-label="Switch to dark mode">🌙</button>

        <a href="login.html" class="active">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </div>

</header>


<main class="login-main">

    <section class="login-section">

        <div class="login-header">

            <p class="section-label" id="loginModeLabel">Student Account</p>

            <h1>
                Welcome Back!
            </h1>

            <p class="login-description" id="loginDescription">
                Sign in to access your StudentHub account.
            </p>

        </div>

        <div class="login-mode-tabs" role="tablist" aria-label="Choose login type">
            <button class="login-mode-tab active" type="button" role="tab"
                    id="studentLoginTab" aria-selected="true" data-login-mode="student">
                Student Login
            </button>
            <button class="login-mode-tab" type="button" role="tab"
                    id="adminLoginTab" aria-selected="false" data-login-mode="admin">
                Admin Login
            </button>
        </div>

        <form
            class="login-form"
            id="loginForm"
            action="../php/login.php"
            method="POST"
            novalidate
        >

            <input type="hidden" name="return_to" id="return_to" value="">
            <input type="hidden" name="user_type" id="user_type" value="student">
            <input type="hidden" name="csrf_token" id="csrf_token" value="">
            <p class="login-feedback" id="loginFeedback"
               role="alert" aria-live="assertive" hidden></p>

            <div class="form-group">

                <label for="login-email" id="loginIdentifierLabel">Email or Username</label>

                <input
                    type="text"
                    id="login-email"
                    name="identifier"
                    placeholder="Enter your email or username"
                    autocomplete="username"
                    maxlength="255"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        maxlength="100"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                    >
                        Show
                    </button>

                </div>

            </div>


            <p class="forgot-password">

                <a href="contact.html">
                    Forgot Password?
                </a>

            </p>


            <button
                type="submit"
                class="login-submit"
            >
                Login
            </button>

        </form>


        <p class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </section>

</main>


<footer class="studenthub-footer studenthub-footer--compact">
    <nav aria-label="Account help links">
        <a href="index.html">Home</a>
        <a href="register.html">Create an account</a>
        <a href="contact.html">Help</a>
    </nav>
    <p class="studenthub-footer__legal">&copy; 2026 StudentHub.</p>
</footer>


<script src="../javascript/login.js?v=3" defer></script>

<script src="../javascript/session-nav.js" defer></script>
</body>
</html>
