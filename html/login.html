            </summary>


            <!-- =================================================
                 DROPDOWN NAVIGATION
                 ================================================= -->

            <nav class="dropdown-menu"
                 aria-label="Main navigation">


                <a href="index.html">

                    <span class="menu-icon">

                    </span>

                    <span>
                        Home
                    </span>

                </a>


                <a href="about.html">

                    <span class="menu-icon">
                        ⓘ
                    </span>

                    <span>
                        About
                    </span>

                </a>


                <a href="dashboard.html">

                    <span class="menu-icon">
                        ▣
                    </span>

                    <span>
                        Dashboard
                    </span>

                </a>


                <a href="events.html">

                    <span class="menu-icon">
                        ▦

                    <span>

                <a href="profile.html">

                    <span class="menu-icon">
                        👤

                <a href="contact.html">

                    <span class="menu-icon">
                        ✉

                    <span>

                </a>

            </nav>

        </details>

    </div>



    <!-- =================================================
         STUDENTHUB LOGO
         ================================================= -->

    <a href="index.html"
       class="logo"
       aria-label="StudentHub Home">


        <span class="logo-icon">
            🎓
        </span>


        <span class="logo-text">
            StudentHub
        </span>


    </a>



    <!-- =================================================
         LOGIN / REGISTER
         ================================================= -->

    <div class="auth-buttons">


        <a href="login.html"
           aria-current="page">

            Login

        </a>


        <a href="register.html">

            Register

        </a>


    </div>


</header>



<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<main class="login-main">


    <section class="login-section"
             aria-labelledby="login-title">


        <!-- =================================================
             LOGIN HEADER
             ================================================= -->

        <div class="login-header">

            <p class="section-label">
                Student Account
            </p>

            <h1 id="login-title">
                Welcome Back!
            </h1>

            <p class="login-description">
                Sign in to access your StudentHub account.
            </p>

        </div>



        <!-- =================================================
             LOGIN FORM
             ================================================= -->

        <form class="login-form"
              action="#"
              method="post">


            <!-- =================================================
                 USERNAME / EMAIL
                 ================================================= -->

            <div class="form-group">

                <label for="login-email">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="login-email"
                    name="username"
                    placeholder="Enter username or email"
                    autocomplete="username"
                    required>

            </div>



            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>



            <!-- =================================================
                 FORGOT PASSWORD
                 ================================================= -->

            <p class="forgot-password">

                <a href="#">
                    Forgot Password?
                </a>

            </p>



            <!-- =================================================
                 LOGIN BUTTON
                 ================================================= -->

            <button
                type="submit"
                class="login-submit">

                Login

            </button>


        </form>



        <!-- =================================================
             REGISTER LINK
             ================================================= -->

        <p class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


    </section>


</main>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="site-footer">

        All rights reserved.
    </p>

</footer>


</body>
